<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Formularz</title>
</head>
<body>
  <h1>Formularz testowy</h1>
  <form>
    <label for="name">Imię</label>
    <input id="name" name="name" placeholder="Twoje imię">
    <label for="color">Kolor</label>
    <select id="color" aria-label="Kolor">
      <option>czerwony</option>
      <option>zielony</option>
    </select>
    <label for="agree">
      <input type="checkbox" id="agree" name="agree"> Zgoda
    </label>
    <label for="secret">Hasło</label>
    <input type="password" id="secret" name="password" aria-label="Hasło">
    <button type="submit" id="send">Wyślij</button>
    <button type="button" id="buy">Kup teraz</button>
  </form>
</body>
</html>
